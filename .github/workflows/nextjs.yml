# Build the Next.js static export (`out/`) and publish it to GitHub Pages.
#
# Publishing source: GitHub Actions (artifact upload). The site is served at the
# root of the custom domain in CNAME (`ohgo.pizenlabs.dev`), so no `basePath`
# is applied. If the custom domain is ever removed and the site falls back to
# Project Pages (`https://<owner>.github.io/<repo>/`), set
# NEXT_PUBLIC_BASE_PATH to `/<repo>` in the build step below — `next.config.mjs`
# and `lib/base-path.ts` both read that variable.

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Required by the Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and let in-progress production
# deployments finish instead of cancelling them.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        # NOTE: no `static_site_generator: next` on purpose.
        # configure-pages would rewrite next.config.mjs (inject basePath) and
        # its injector corrupts the `basePath` shorthand into a bare string
        # (`SyntaxError: Unexpected string`). The config is self-managed:
        # output/export + images.unoptimized are already set in the file.
        uses: actions/configure-pages@v6

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # New cache whenever packages or source files change; otherwise
          # restore the most recent one for a faster rebuild.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npx --no-install next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
